# ORA platform - test server stack.   Run through ./deploy/deploy.sh
name: ora-test

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    # Test inbox for verification / reset / reviewer e-mails.
    # TEST ONLY: anyone who can reach this port can read the mails.
    ports:
      - "8025:8025"

  auth:
    build: { context: .., dockerfile: deploy/Dockerfile.auth }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: 1
      COOKIE_SECURE: ${COOKIE_SECURE}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN_DAYS: 7
      REMEMBER_ME_REFRESH_TOKEN_EXPIRES_IN_DAYS: 30
      FRONTEND_URL: ${PUBLIC_URL}
      ADMIN_FIRST_NAME: ORA
      ADMIN_LAST_NAME: Administrator
      ADMIN_USERNAME: superadmin
      ADMIN_EMAIL: admin@ora.local
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      MAIL_FROM: "ORA Platform <no-reply@ora.local>"

  journal:
    build: { context: .., dockerfile: deploy/Dockerfile.journal }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4001
      TRUST_PROXY: 1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      FRONTEND_URL: ${PUBLIC_URL}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: 20
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      MAIL_FROM: "ORA Journals <no-reply@ora.local>"
    volumes:
      - uploads:/data/uploads

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    restart: unless-stopped
    depends_on: [auth, journal]
    ports:
      - "80:80"

volumes:
  pgdata:
  uploads:
